# The plateau delta over the canonical jis-ja pack: the plateau
# bilingual forms - the fullwidth space as the field separator, 『』
# for component titles, 「」 for series titles - for Japanese items in
# a Japanese document.
name: "ISO 690 (metanorma-plateau flavour, ja document, en items)"
family: iso690
extends: jis-en
scheme:
  locale:
    labels:
      list_separator: ", "
      extent_group_separator: ", "
templates:
  titleOpen: ""
  titleClose: ""
  identifierMode: first
  citation: "{{surname}} {{date}}"
  uri: "<span class='biburl'><fmt-link target='{{uri}}'>{{uri}}</fmt-link></span>"
  reference: "{{creator}}{{role}} {{title}} {{edition}} ({{series}}) {{production}} {{date}} {{size}}"
  name: "{{surname}} {{givenNames}}"
perType:
  - type: report
    home: true
    short: "「<span class='stddocTitle'>{{title}}</span>」、 {{extent}}"
    template: "{{title}}"
    title: "<span class='stddocTitle'>「{{title}}」</span>"
  - type: report
    fallbacks:
      date: "日付なし"
    template: "{{creator}} {{title}} {{edition}} {{production}} {{authorizer}} {{location}}"
    short: "{{creator}} 「<span class='stddocTitle'>{{title}}</span>」 {{edition}} {{production}}"
    title: "<span class='stddocTitle'>「{{title}}」</span>"
  - type: monograph
    noPlace: true
    fallbacks:
      date: "日付なし"
    template: "{{creator}}{{role}} {{title}} {{edition}} ({{series}}) {{production}} {{date}} {{size}} {{location}}"
  - type: continuing
    template: "{{title}} {{date}}"
  - type: online
    fallbacks:
      date: "日付なし"
    template: "{{creator}} {{title}} {{production}} {{date}} {{location}}"
  - type: webdoc
    fallbacks:
      date: "日付なし"
    template: "{{creator}} {{title}} {{production}} {{date}} {{location}}"
  - type: component_part
    noPlace: true
    template: "{{creator}}{{role}} 『{{title}}』 {{componentpart}} {{edition}} ({{series}}) {{production}} {{date}} {{extent}} {{location}}"
  - type: serial_part
    template: "{{creator}}{{role}} 『{{title}}』 {{series}} {{date}}, {{extent}} {{location}}"
    series: "「{{seriestitle}} ({{seriesrun}})」"
  - type: article
    template: "{{creator}}{{role}} 『{{title}}』 {{series}} {{date}}, {{extent}}"
    series: "「{{seriestitle}} ({{seriesrun}})」"
