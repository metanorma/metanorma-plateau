name: "ISO 690 (metanorma-plateau flavour, ja document, en items)"
family: iso690
extends: jis-en
scheme:
  locale:
    labels:
      list_separator: ", "
      extent_group_separator: ", "
      date: "n.d"
  nameForm:
    orgUpcase: false
    completenameUpcase: false
templates:
  name: "{{surname}} {{givenNames}}"
  titleOpen: ""
  titleClose: ""
  reference: "{{creator}}{{role}} {{title}} {{edition}} ({{series}}) {{production}} {{date}} {{size}}"
perType:
  - type: report
    home: true
    short: "<span class='stddocTitle'>「{{title}}」</span>、 {{extent}}"
    template: "{{title}}"
    title: "<span class='stddocTitle'>「{{title}}」</span>"
  - type: report
    fallbacks:
      date: "日付なし"
    template: "{{creator}} {{title}} {{edition}} {{production}} {{authorizer}} {{location}}"
    short: "{{creator}} <span class='stddocTitle'>「{{title}}」</span> {{edition}} {{production}}"
    title: "<span class='stddocTitle'>{{title}}</span>"
  - type: monograph
    template: "{{creator}}{{role}} {{title}} {{edition}} ({{series}}) {{production}} {{date}} {{size}} {{location}}"
  - type: component_part
    template: "{{creator}}{{role}} {{title}} {{componentpart}} {{edition}} ({{series}}) {{production}} {{date}} {{extent}} {{location}}"
  - type: serial_part
    template: "{{creator}}{{role}} 『{{title}}』 {{series}} {{date}}, {{extent}} {{location}}"
    series: "「{{seriestitle}} ({{seriesrun}})」"
  - type: article
    template: "{{creator}}{{role}} 『{{title}}』 {{series}} {{date}}, {{extent}}"
    series: "「{{seriestitle}} ({{seriesrun}})」"
